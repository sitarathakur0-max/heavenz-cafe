<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="50%" stop-color="#FFC629" />
      <stop offset="100%" stop-color="#E5A600" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A28A8" />
      <stop offset="100%" stop-color="#211568" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded panel with purple fill -->
  <rect x="6" y="6" width="508" height="168" rx="20" fill="url(#purpleGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Golden side accent panels reflecting signboard architecture -->
  <rect x="18" y="22" width="6" height="136" rx="3" fill="url(#goldGrad)" />
  <rect x="496" y="22" width="6" height="136" rx="3" fill="url(#goldGrad)" />

  <!-- Distinctive curved golden arc sweeping gracefully above the wordmark -->
  <path d="M 100 52 C 170 24, 350 24, 420 52" fill="none" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round" />
  <path d="M 125 58 C 185 36, 335 36, 395 58" fill="none" stroke="#FFE885" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  
  <!-- Central golden crown / sparkle accent above the arc -->
  <polygon points="260,20 263,27 270,30 263,33 260,40 257,33 250,30 257,27" fill="url(#goldGrad)" />

  <!-- HeavenZ Wordmark with capital Z -->
  <text x="260" y="106" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="1">
    <tspan fill="#FFFFFF">Heaven</tspan><tspan fill="url(#goldGrad)">Z</tspan>
  </text>

  <!-- Tagline: Real Taste of Chicken -->
  <text x="260" y="142" font-family="'DM Sans', 'Arial', sans-serif" font-size="14.5" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3.5">
    REAL TASTE OF CHICKEN
  </text>
</svg>
